<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex Modern</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="painel">
        <div class="detalhe-superior">
            <div class="circulo-azul"></div>
            <div class="luzes">
                <div class="luz vermelha"></div>
                <div class="luz amarela"></div>
                <div class="luz verde"></div>
            </div>
        </div>
        <h1>Pokédex</h1>
        <div id="tela-container">
            <div id="tela">
                <p class="placeholder-text">Pesquise um Pokémon!</p>
            </div>
        </div>
        <div class="controles">
            <input type="text" id="entrada" placeholder="Nome ou ID">
            <button id="btn-buscar" onclick="buscar()">Pesquisar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
